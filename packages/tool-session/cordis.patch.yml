# tool-session bundle patch: the session management surface over dsh-base.
#
# dsh-base mounts the session store, JSONL persistence, projections, and the
# session-title service, but NOT session-tags (still WIP upstream) and of
# course not this project's own packages. This single bundle mounts the whole
# stack: the tags service (hidden-prefix visibility rules), the local
# session-tool provider, and the five session_* tools.
#
# Install with: dsh plugin --profile <name> add <path/to/packages/tool-session>
- insert:
    # session-tags Config has no defaults (all fields required), so the row
    # supplies the deployment values here. hiddenPrefixes is the "sessions I
    # mark myself stay out of default lists" convention (e.g. '~', '[internal]').
    - id: session-tags
      name: '@deepseek-ai/dsh-session-tags'
      config:
        maxTags: 20
        maxTagBytes: 128
        hiddenPrefixes:
          - '~'

    - id: session-tool-local
      name: 'session-tool-local'
      config:
        allowAllScope: 'top-level'
        cliAllowAll: true
        readMaxBlocks: 500
        listMaxRows: 100
        # Base URL of the web gateway (`dsh web`), the workspace registry's
        # authority. Workspace registration and management go over this
        # gateway's HTTP carrier; point it at the running web process.
        webUrl: 'http://127.0.0.1:3080'
        # Continuation authorization for the plugin tool path (ASM-009):
        # 'workspace' (default) admits same-workspace callers; 'creator'
        # admits only the lineage creator; 'anyone' admits every caller.
        # The upstream subagent tool path keeps workspace-level auth and
        # never reads this value.
        allowOthersToWrite: 'workspace'
        # Delegation-depth ceiling for the plugin tool path; unset = no
        # local ceiling (the web gateway still admits parent depth + 1).
        # maxDelegationDepth: 8
        # Whether delegated sessions appear in session_list (default true).
        showDelegated: true

    - id: tool-session
      name: 'tool-session'
